    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container">
            <a href="https://giakbsu.ru/" class="navbar-brand d-none d-sm-block">Единый государственный экзамен</a>
            <a href="https://giakbsu.ru/" class="ps-3 navbar-brand d-block d-sm-none">ЕГЭ</a>
            
            <div class="pe-2">
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navmenu">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Showcase -->
    <section class="showcase-section bg-dark text-light py-5">
        <div class="container pt-3">
            <div class="d-sm-flex py-5 px-4 px-md-5 row justify-content-between align-items-center">
                <div class="col-md">
                    <div class="d-flex d-sm-block justify-content-center pb-4"><h1>Профстарт 2.0</h1></div>
                    <div class="pt-2 d-flex d-sm-block justify-content-center">
                        <button class="btn btn-primary btn-lg rounded-4 custom-register-button" data-bs-toggle="modal" data-bs-target="#enroll">Зарегистрироваться</button>
                    </div>
                </div>
                <div class="col-md d-none d-md-block sectionImagediv-1">
                    <img src="files/KBSU-1.jpg" class="d-block w-100 customSectionImage-1" alt="">
                </div>
            </div>
        </div>
    </section>


<!-- Footer -->
<section class="bg-nav-bg custom-footer" id="contact">
    <div class="container px-5 px-lg-1">
        <footer class="py-5">
        <div class="d-flex justify-content-between">
            <div class="mb-3 footer-phone-number d-flex align-items-center">
                <div class="footer-outlinedBoxes d-flex align-items-center justify-content-center text-light"><svg width="24" height="24"><use xlink:href="#footer-phone-number-icon-svg"/></svg></div>
                <div class="ps-3 text-light">+7 (866) 272-20-24</div>
            </div>
            <a href="https://t.me/xAlenki" class="text-light" style="text-decoration: none;" target="_blank">Made by KARAF</a>
            <div class="offset-md-1 list-unstyled d-flex flex-row-reverse mb-3">
                <div class="align-content-center">
                    <li class="ms-3"><a class="link-body-emphasis" href="https://t.me/abiturient_kbgu" target="_blank"><svg class="bi bi-telegram" width="24" height="24"><use xlink:href="#telegram"/></svg></a></li>
                </div>
            </div>
        </div>
        </footer>
    </div>
</section>

    <!-- Modal -->
    <div class="modal fade" id="enroll" tabindex="-1" aria-labelledby="enrollLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="enrollLabel">Регистрация</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
            <div class="modal-body">
                <form id="form">
                    <div class="mb-3">
                        <label for="first-name" class="col-form-label">ФИО:</label>
                        <input type="text" class="form-control reqField" name="name" id="first-name">
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="col-form-label">ИНН:</label>
                        <input type="text" class="form-control reqField" name="INN" id="INN">
                    </div>
                    <!-- ЧЕК -->
                    <div class="d-flex align-items-center pb-1">
                        <label for="media" onclick="fileUploadClick">
                            <div class="btn btn-primary">Выбрать файл</div>
                        </label>
                        <input type="file" class="pb-3" name="media" accept="application/pdf" id="media" style="display:none;" onchange="showname()"/>
                        <span class="ps-2" id="choose_file_text">Прикрепите чек</span>
                    </div>

                    <!-- ID товара в в админ панели -->
                    <input type="hidden" name="product_id" value="21">
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отменить</button>
                <button type="submit" class="btn btn-primary disabled" id="submit" aria-disabled="true" tabindex="-1">Продолжить</button>
            </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <!-- Custom JavaScript -->
    <script src="komadejss.js"></script>
</body>
</html>
